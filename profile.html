<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile | SwiftRide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen">
  <h1>Profile</h1>
  <div style="display:flex;align-items:center;gap:14px">
    <div id="av" class="avatar big"></div>
    <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
      <strong id="nm" style="font-size:20px"></strong>
      <span id="ph" class="sub" style="margin:0;font-size:14px"></span>
    </div>
  </div>
  <div class="list">
    <a href="photo.html?from=profile">Change photo <small>Edit</small></a>
    <a href="pricepadi.html?from=profile">Price Padi <small id="pp"></small></a>
    <div class="r">Payment <small>Cash</small></div>
    <div class="r">Emergency contact <small>Coming soon</small></div>
  </div>
  <div class="spacer"></div>
  <button id="out" class="btn small" type="button">Log out</button>
  <nav class="nav" aria-label="Main">
    <a href="customer.html">Home</a>
    <span class="off">Activity</span>
    <a class="on" href="profile.html" aria-current="page">Profile</a>
  </nav>
</main>
<script type="module">
import { requireRole, avatarUrl, initials, signOut } from './common.js';
const profile = await requireRole('customer');
if (profile) {
  document.getElementById('nm').textContent = profile.full_name;
  document.getElementById('ph').textContent = profile.phone || '';
  document.getElementById('pp').textContent = profile.price_padi_name || 'Not named yet';
  const av = document.getElementById('av');
  const url = await avatarUrl(profile.photo_url);
  if (url) { const i = document.createElement('img'); i.src = url; i.alt = ''; i.style.cssText = 'width:100%;height:100%;object-fit:cover'; av.appendChild(i); }
  else av.textContent = initials(profile.full_name);
}
document.getElementById('out').addEventListener('click', signOut);
</script>
</body>
</html>
