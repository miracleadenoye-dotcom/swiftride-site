<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home | SwiftRide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen">
  <div class="topbar">
    <div class="brand"><i></i>SwiftRide</div>
    <a id="av" class="avatar" href="profile.html" aria-label="Your profile"></a>
  </div>
  <div>
    <h1 id="hi">Hi</h1>
    <p class="sub" style="margin-top:4px">Where are we going today?</p>
  </div>
  <div class="hero"><strong style="font-size:22px">Book a ride</strong><p>Ride booking is the next thing we are building.</p></div>
  <div class="tiles">
    <div class="tile"><strong>Send a package</strong><span class="soon">SwiftRide for Business</span></div>
    <div class="tile"><strong>Ride history</strong><small>Receipts and trips</small><span class="soon">Soon</span></div>
    <div class="tile"><strong>Saved places</strong><small>Home, school</small><span class="soon">Soon</span></div>
    <div class="tile"><strong>Promos</strong><small>Codes and offers</small><span class="soon">Soon</span></div>
  </div>
  <nav class="nav" aria-label="Main">
    <a class="on" href="customer.html" aria-current="page">Home</a>
    <span class="off">Activity</span>
    <a href="profile.html">Profile</a>
  </nav>
</main>
<script type="module">
import { requireRole, avatarUrl, initials } from './common.js';
const profile = await requireRole('customer');
if (profile) {
  if (!profile.photo_url) window.location.replace('photo.html');
  document.getElementById('hi').textContent = 'Hi, ' + profile.full_name.split(' ')[0];
  const av = document.getElementById('av');
  const url = await avatarUrl(profile.photo_url);
  if (url) { const i = document.createElement('img'); i.src = url; i.alt = ''; i.style.cssText = 'width:100%;height:100%;object-fit:cover'; av.appendChild(i); }
  else av.textContent = initials(profile.full_name);
}
</script>
</body>
</html>
