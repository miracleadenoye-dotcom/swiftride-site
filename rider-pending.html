<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pending Approval | SwiftRide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.status-badge {
  display: inline-block;
  padding: 6px 14px;
  background: #FEF3C7;
  color: #92400E;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.icon-box {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: #EEF4FF;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  margin: 16px auto 0;
}
</style>
</head>
<body>
<main class="screen" style="text-align:center;align-items:center">
  <div class="brand"><i></i>SwiftRide Rider</div>
  
  <div class="icon-box">⏳</div>
  
  <h1 style="margin-top:10px">Application Under Review</h1>
  <span class="status-badge" id="badge">Pending Verification</span>

  <p class="sub" style="margin-top:8px;line-height:1.5">
    Your documents have been submitted to the SwiftRide admin team. We verify all riders in Ekiti State before activating their account.
  </p>

  <div class="card" style="width:100%;text-align:left;margin-top:14px">
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">
      <span style="font-size:13px;color:var(--mute)">Rider Name</span>
      <strong id="riderName" style="font-size:14px">Loading...</strong>
    </div>
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">
      <span style="font-size:13px;color:var(--mute)">Plate Number</span>
      <strong id="riderPlate" style="font-size:14px">Loading...</strong>
    </div>
    <div style="display:flex;justify-content:space-between;padding:6px 0">
      <span style="font-size:13px;color:var(--mute)">Submitted On</span>
      <span id="subDate" style="font-size:13px;font-weight:600">Today</span>
    </div>
  </div>

  <div class="spacer"></div>
  <button id="refresh" class="btn" type="button">Check Approval Status</button>
  <button id="logout" class="link" type="button">Log out</button>
</main>

<script type="module">
import { supabase, requireRole, signOut } from './common.js';

const profile = await requireRole('rider');
if (!profile) throw new Error('Not signed in');

const $ = (id) => document.getElementById(id);
$('logout').addEventListener('click', signOut);

async function checkStatus() {
  const { data: rider, error } = await supabase.from('riders').select('*').eq('id', profile.id).maybeSingle();
  if (!rider) {
    window.location.replace('rider-docs.html');
    return;
  }
  
  $('riderName').textContent = profile.full_name;
  $('riderPlate').textContent = rider.plate_number;
  
  if (rider.status === 'approved') {
    window.location.replace('rider.html');
  } else if (rider.status === 'rejected') {
    $('badge').textContent = 'Rejected: ' + (rider.rejection_reason || 'Check documents');
    $('badge').style.background = '#FDECEC';
    $('badge').style.color = '#8A1C1C';
  }
}

$('refresh').addEventListener('click', async () => {
  $('refresh').textContent = 'Checking...';
  await checkStatus();
  setTimeout(() => { $('refresh').textContent = 'Check Approval Status'; }, 1000);
});

await checkStatus();
</script>
</body>
</html>
