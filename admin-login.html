<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Sign In | SwiftRide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body {
  background: #001b44;
  color: #fff;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.portal-card {
  width: 100%;
  max-width: 400px;
  background: #0a192f;
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.4);
}
.shield-icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: rgba(48,176,80,0.15);
  border: 1px solid var(--green);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
}
.portal-card label {
  color: #CBD3E1;
}
.portal-card input {
  background: #001229;
  border-color: #1e3a63;
  color: #fff;
}
.portal-card input:focus {
  border-color: var(--green);
  outline: 2px solid var(--green);
}
</style>
</head>
<body>
<div class="portal-card">
  <div class="shield-icon">🛡️</div>
  <div>
    <h1 style="font-size:24px;color:#fff">Staff Portal</h1>
    <p style="margin:4px 0 0;font-size:13px;color:#94A3B8">SwiftRide Admin & Management Access</p>
  </div>

  <p id="msg" class="msg err" hidden role="alert"></p>

  <form id="adminForm" style="display:flex;flex-direction:column;gap:14px;margin-top:8px">
    <label>Staff Email
      <input id="email" type="email" placeholder="admin@swiftride.com" required autocomplete="username">
    </label>
    <label>Master Password
      <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password">
    </label>
    <button id="btn" class="btn" type="submit" style="margin-top:10px">Sign In to Dashboard</button>
  </form>

  <p style="text-align:center;margin:12px 0 0;font-size:12px;color:#64748B">
    🔒 Restricted Access. All logins are logged and audited.
  </p>
</div>

<script type="module">
import { supabase, showMessage, getProfile } from './common.js';

const $ = (id) => document.getElementById(id);
const form = $('adminForm');
const btn = $('btn');
const msg = $('msg');

// If already signed in as admin, jump straight to dashboard
const existing = await getProfile();
if (existing && existing.role === 'admin') {
  window.location.replace('admin.html');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  btn.textContent = 'Verifying credentials...';
  showMessage(msg, '');

  const email = $('email').value.trim();
  const password = $('password').value;

  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;

    // Verify role in profiles table
    const { data: profile, error: pErr } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', data.user.id)
      .maybeSingle();

    if (pErr) throw pErr;

    if (!profile || profile.role !== 'admin') {
      await supabase.auth.signOut();
      throw new Error('Access Denied: This account is not authorized as an Admin.');
    }

    // Success -> send to Admin Dashboard
    window.location.replace('admin.html');
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Sign In to Dashboard';
    showMessage(msg, err.message);
  }
});
</script>
</body>
</html>
