<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a ride | SwiftRide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen" style="padding:0;gap:0">
  <div class="topbar" style="padding:14px 20px">
    <a class="avatar" href="customer.html" aria-label="Back to home">&larr;</a>
    <strong style="font-size:17px">Book a ride</strong>
    <span style="width:44px"></span>
  </div>
  <div id="map" class="map" role="application" aria-label="Map"></div>

  <section id="step1" class="sheet">
    <h1>Where to?</h1>
    <p id="msg" class="msg err" hidden role="alert"></p>
    <div class="field"><div><small>Pickup</small><span id="pickupText">Locating you...</span></div><button id="chgPickup" class="chip" type="button" style="height:38px;font-size:13px">Change on map</button></div>
    <label>Destination<input id="dest" type="text" placeholder="Search a town, street or place in Ekiti" autocomplete="off"></label>
    <ul id="sug" class="sug" hidden></ul>
    <div id="saved" class="chips"></div>
    <p class="sub" style="margin:0;font-size:13px">You can also tap the map to drop a pin.</p>
    <div class="spacer"></div>
    <button id="next" class="btn" type="button" disabled>Continue</button>
  </section>

  <section id="step2" class="sheet" hidden>
    <h1>Name your price</h1>
    <p id="msg2" class="msg err" hidden role="alert"></p>
    <div class="field"><div><small>Trip</small><span id="route"></span></div></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="sub" style="margin:0">Suggested fare</span><strong id="est"></strong></div>
    <div class="stepper"><button id="minus" type="button" aria-label="Decrease offer">&minus;</button><div id="amt" class="amount" aria-live="polite"></div><button id="plus" type="button" aria-label="Increase offer">+</button></div>
    <div class="padi" aria-live="polite"><div class="pa" id="padiIcon"></div><div style="min-width:0"><div style="display:flex;align-items:center;flex-wrap:wrap"><span class="pn" id="padiName"></span><span id="padiChip" class="vc"></span></div><span id="padiText" style="font-size:15px;font-weight:600;line-height:1.35"></span></div></div>
    <div><span class="lbl">Carrying a load?</span>
      <div class="seg" id="loads" style="margin-top:8px"><button type="button" data-v="none" aria-pressed="true">No load</button><button type="button" data-v="small_bag" aria-pressed="false">Small bag</button><button type="button" data-v="big_load" aria-pressed="false">Big load</button></div></div>
    <div><span class="lbl">Pay with</span>
      <div class="seg" style="margin-top:8px"><button type="button" aria-pressed="true">Cash</button><button type="button" disabled>Card, coming soon</button></div></div>
    <div class="spacer"></div>
    <button id="request" class="btn" type="button">Request ride</button>
    <button id="back" class="link" type="button">Back</button>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script type="module">
import { supabase, requireRole, activeRide, naira, BIKE_SVG, padiVerdict, showMessage } from './common.js';
const profile = await requireRole('customer');
if (!profile) throw new Error('not signed in');
if (!profile.photo_url) window.location.replace('photo.html');
const going = await activeRide(profile.id);
if (going) window.location.replace('ride.html?id=' + going.id);

const $ = (id) => document.getElementById(id);
const CENTER = [7.72, 5.31]; // Ekiti State
const map = L.map('map', { zoomControl: true }).setView(CENTER, 9);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
let pickup = null, dest = null, tapMode = 'dest', pMark = null, dMark = null, line = null;

function km(a, b) {
  const R = 6371, rad = (d) => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function draw() {
  if (pMark) map.removeLayer(pMark); if (dMark) map.removeLayer(dMark); if (line) map.removeLayer(line);
  if (pickup) pMark = L.circleMarker([pickup.lat, pickup.lng], { radius: 9, color: '#fff', weight: 3, fillColor: '#000033', fillOpacity: 1 }).addTo(map);
  if (dest) dMark = L.circleMarker([dest.lat, dest.lng], { radius: 9, color: '#000033', weight: 3, fillColor: '#30B050', fillOpacity: 1 }).addTo(map);
  if (pickup && dest) {
    line = L.polyline([[pickup.lat, pickup.lng], [dest.lat, dest.lng]], { color: '#0D47A1', weight: 4, dashArray: '6 8' }).addTo(map);
    map.fitBounds(line.getBounds(), { padding: [40, 40] });
  }
  $('next').disabled = !(pickup && dest);
}
function setPickup(p) { pickup = p; $('pickupText').textContent = p.text; tapMode = 'dest'; $('chgPickup').setAttribute('aria-pressed', 'false'); draw(); }
function setDest(p) { dest = p; $('dest').value = p.text; $('sug').hidden = true; draw(); }

navigator.geolocation?.getCurrentPosition(
  (pos) => { const p = { lat: pos.coords.latitude, lng: pos.coords.longitude, text: 'Current location' }; setPickup(p); map.setView([p.lat, p.lng], 15); },
  () => { $('pickupText').textContent = 'Tap the map to set pickup'; tapMode = 'pickup'; },
  { enableHighAccuracy: true, timeout: 8000 });
if (!navigator.geolocation) { $('pickupText').textContent = 'Tap the map to set pickup'; tapMode = 'pickup'; }
$('chgPickup').addEventListener('click', () => { tapMode = 'pickup'; $('pickupText').textContent = 'Tap the map to set pickup'; });

async function reverse(lat, lng) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&lat=${lat}&lon=${lng}`);
    const j = await r.json();
    return j.display_name ? j.display_name.split(',').slice(0, 2).join(',').trim() : null;
  } catch { return null; }
}
map.on('click', async (e) => {
  const { lat, lng } = e.latlng;
  if (tapMode === 'pickup') { setPickup({ lat, lng, text: 'Pinned pickup' }); const t = await reverse(lat, lng); if (t && pickup) { pickup.text = t; $('pickupText').textContent = t; } }
  else { setDest({ lat, lng, text: 'Pinned location' }); const t = await reverse(lat, lng); if (t && dest) { dest.text = t; $('dest').value = t; } }
});

// destination search (OpenStreetMap Nominatim)
let timer;
$('dest').addEventListener('input', () => {
  clearTimeout(timer); dest = null; draw();
  const q = $('dest').value.trim();
  if (q.length < 3) { $('sug').hidden = true; return; }
  timer = setTimeout(async () => {
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=ng&viewbox=4.75,8.1,5.85,7.2&q=${encodeURIComponent(q)}`;
      const list = await (await fetch(url)).json();
      const ul = $('sug'); ul.innerHTML = '';
      if (!list.length) { const li = document.createElement('li'); li.textContent = 'No match. Try another name, or tap the map.'; ul.appendChild(li); }
      list.forEach((it) => {
        const li = document.createElement('li');
        li.textContent = it.display_name.split(',').slice(0, 3).join(',');
        li.addEventListener('click', () => { setDest({ lat: +it.lat, lng: +it.lon, text: li.textContent }); map.setView([+it.lat, +it.lon], 15); });
        ul.appendChild(li);
      });
      ul.hidden = false;
    } catch { showMessage($('msg'), 'Search is not working right now. Tap the map instead.'); }
  }, 700);
});

// saved places
const { data: places } = await supabase.from('saved_places').select('*').order('created_at');
(places || []).forEach((p) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = p.label;
  b.addEventListener('click', () => { setDest({ lat: p.lat, lng: p.lng, text: p.address_text }); map.setView([p.lat, p.lng], 15); });
  $('saved').appendChild(b);
});

// fare settings
let S = { base_fare: 300, price_per_km: 100, minimum_fare: 400, small_bag_extra: 100, big_load_extra: 300 };
const { data: srow } = await supabase.from('settings').select('*').eq('id', 1).maybeSingle();
if (srow) S = srow;
let load = 'none', est = 0, offer = 0, edited = false, distance = 0;
const round50 = (n) => Math.max(50, Math.round(n / 50) * 50);
function estimate() {
  const extra = load === 'small_bag' ? +S.small_bag_extra : load === 'big_load' ? +S.big_load_extra : 0;
  return round50(Math.max(+S.minimum_fare, +S.base_fare + +S.price_per_km * distance) + extra);
}
function render() {
  $('est').textContent = naira(est);
  $('amt').textContent = naira(offer);
  const v = padiVerdict(offer, est);
  $('padiText').textContent = v.text;
  $('padiChip').textContent = v.label; $('padiChip').className = 'vc ' + v.key;
}
$('padiIcon').innerHTML = BIKE_SVG;
$('padiName').textContent = profile.price_padi_name || 'Price Padi';

$('next').addEventListener('click', () => {
  distance = Math.max(0.3, km(pickup, dest) * 1.3); // straight line plus 30% for road bends
  est = estimate(); if (!edited) offer = est;
  $('route').textContent = `${pickup.text} to ${dest.text} (about ${distance.toFixed(1)} km)`;
  $('step1').hidden = true; $('step2').hidden = false; render(); window.scrollTo(0, 0);
});
$('back').addEventListener('click', () => { $('step2').hidden = true; $('step1').hidden = false; });
$('minus').addEventListener('click', () => { offer = Math.max(100, offer - 50); edited = true; render(); });
$('plus').addEventListener('click', () => { offer = Math.min(100000, offer + 50); edited = true; render(); });
document.querySelectorAll('#loads button').forEach((b) => b.addEventListener('click', () => {
  load = b.dataset.v;
  document.querySelectorAll('#loads button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  est = estimate(); if (!edited) offer = est; render();
}));
$('request').addEventListener('click', async () => {
  const btn = $('request'); btn.disabled = true; showMessage($('msg2'), '');
  const row = {
    customer_id: profile.id, pickup_text: pickup.text.slice(0, 200), pickup_lat: pickup.lat, pickup_lng: pickup.lng,
    destination_text: dest.text.slice(0, 200), destination_lat: dest.lat, destination_lng: dest.lng,
    load_type: load, estimated_fare: est, offered_price: offer, payment_method: 'cash'
  };
  const { data, error } = await supabase.from('rides').insert(row).select('id').single();
  if (error) { btn.disabled = false; return showMessage($('msg2'), 'Could not request your ride: ' + error.message); }
  window.location.replace('ride.html?id=' + data.id);
});
</script>
</body>
</html>
